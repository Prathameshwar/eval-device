<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The AI Evaluator mark as a favicon. Same geometry as `src/components/BrandMark.tsx`, scaled
    into a 32px tile. The two indigo stops are `--pms-grad-action` from `theme-light.css`, written
    as literals because an icon file cannot read a custom property — that gradient is deliberately
    identical in all three palettes, so one file serves every theme.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4fb0" />
      <stop offset="1" stop-color="#2c3c8c" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#tile)" />
  <g transform="translate(6 6) scale(0.833)">
    <path
      d="M3.4 14 8 18.6 13.8 9.8"
      fill="none"
      stroke="#ffffff"
      stroke-width="2.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M17.8 2.6 19.05 4.75 21.2 6 19.05 7.25 17.8 9.4 16.55 7.25 14.4 6 16.55 4.75Z"
      fill="#ffffff"
    />
  </g>
</svg>
