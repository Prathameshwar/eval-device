[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "training-client"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28,<1",
    "local-model-client>=0.1.0",
    "training-contracts>=0.1.0",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.8,<3",
]

[project.optional-dependencies]
audio = ["sounddevice>=0.5,<1"]
camera = ["opencv-python-headless>=4.12,<5", "av>=16,<17"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.uv.sources]
local-model-client = {path = "../../local-models/client", editable = true}
training-contracts = {path = "../training-contracts", editable = true}

[tool.hatch.build.targets.wheel]
packages = ["src/training_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
